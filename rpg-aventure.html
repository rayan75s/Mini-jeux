<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Aventure</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
#game { width: 680px; }
#canvas { width: 100%; height: 380px; display: block; border-radius: 12px; border: 1px solid #444; background: #1a1a2e; position: relative; overflow: hidden; }
.ui-bar { display: flex; gap: 12px; padding: 12px 0 8px; align-items: center; flex-wrap: wrap; }
.stat { background: #2a2a3e; border-radius: 8px; padding: 6px 14px; font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 6px; }
.stat span { font-weight: bold; color: #fff; font-size: 14px; }
#log { font-size: 13px; color: #aaa; min-height: 22px; padding: 4px 0 8px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; }
.controls button { font-size: 13px; padding: 8px 18px; background: #2a2a3e; color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; }
.controls button:hover { background: #3a3a5e; }
#msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 18px 32px; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: center; display: none; z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<div id="game">
  <canvas id="c" width="680" height="380" style="border-radius:12px;border:1px solid #444;display:block;"></canvas>
  <div id="msg"></div>
  <div class="ui-bar">
    <div class="stat">HP <span id="hp">100</span>/100</div>
    <div class="stat">Or <span id="gold">0</span></div>
    <div class="stat">Lvl <span id="lvl">1</span></div>
    <div class="stat">XP <span id="xp">0</span>/<span id="xpnext">30</span></div>
    <div class="stat">Potions <span id="pots">3</span></div>
  </div>
  <div id="log">Bienvenue, héros ! Explore le monde et bats des monstres.</div>
  <div class="controls">
    <button onclick="move(-1,0)">← Gauche</button>
    <button onclick="move(1,0)">Droite →</button>
    <button onclick="move(0,-1)">↑ Haut</button>
    <button onclick="move(0,1)">↓ Bas</button>
    <button onclick="usePotion()">🧪 Potion</button>
    <button onclick="resetGame()">🔄 Recommencer</button>
  </div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=680,H=380,TILE=40;
const COLS=Math.floor(W/TILE),ROWS=Math.floor(H/TILE);
const COLORS={grass:'#2d5a27',grassLight:'#3a7a33',tree:'#1a3d17',water:'#1a4a7a',waterLight:'#2060aa',path:'#8b7355',mountain:'#6b5a4e',player:'#FFD700',playerShadow:'#cc9900',chest:'#e8c84a',chestShadow:'#c4a030',portal:'#9b59b6',monster:{slime:'#7bc67e',wolf:'#9e7b5a',dragon:'#e74c3c'}};
let state,map,entities;
function initMap(){map=[];for(let r=0;r<ROWS;r++){map[r]=[];for(let c=0;c<COLS;c++){let v=Math.random();if(r===0||r===ROWS-1||c===0||c===COLS-1)map[r][c]='tree';else if(v<0.10)map[r][c]='tree';else if(v<0.14)map[r][c]='water';else if(v<0.19)map[r][c]='mountain';else if(v<0.26)map[r][c]='path';else map[r][c]=Math.random()<0.5?'grass':'grassLight';}}map[Math.floor(ROWS/2)][Math.floor(COLS/2)]='path';}
function isWalkable(r,c){if(r<0||r>=ROWS||c<0||c>=COLS)return false;const t=map[r][c];return t!=='tree'&&t!=='water'&&t!=='mountain';}
function spawnEntities(){entities=[];const mt=['slime','wolf','dragon'];for(let i=0;i<6;i++){let r,c,tries=0;do{r=1+Math.floor(Math.random()*(ROWS-2));c=1+Math.floor(Math.random()*(COLS-2));tries++;}while((!isWalkable(r,c)||(r===state.pr&&c===state.pc))&&tries<50);if(tries<50){const t=mt[Math.min(Math.floor(state.level/2),mt.length-1)];const hp=t==='slime'?20:t==='wolf'?40:80;entities.push({type:'monster',mtype:t,r,c,hp,maxhp:hp});}}for(let i=0;i<3;i++){let r,c,tries=0;do{r=1+Math.floor(Math.random()*(ROWS-2));c=1+Math.floor(Math.random()*(COLS-2));tries++;}while((!isWalkable(r,c)||(r===state.pr&&c===state.pc)||entities.some(e=>e.r===r&&e.c===c))&&tries<50);if(tries<50)entities.push({type:'chest',r,c});}let r,c,tries=0;do{r=1+Math.floor(Math.random()*(ROWS-2));c=1+Math.floor(Math.random()*(COLS-2));tries++;}while((!isWalkable(r,c)||(r===state.pr&&c===state.pc)||entities.some(e=>e.r===r&&e.c===c))&&tries<50);if(tries<50)entities.push({type:'portal',r,c});}
function resetGame(){state={pr:Math.floor(ROWS/2),pc:Math.floor(COLS/2),hp:100,maxhp:100,gold:0,level:1,xp:0,xpNext:30,potions:3,steps:0};initMap();spawnEntities();setLog('Nouvelle aventure ! Explore le monde.');render();updateUI();}
function setLog(msg){document.getElementById('log').textContent=msg;}
function showMsg(msg,duration=1500){const el=document.getElementById('msg');el.textContent=msg;el.style.display='block';setTimeout(()=>{el.style.display='none';},duration);}
function updateUI(){document.getElementById('hp').textContent=state.hp;document.getElementById('gold').textContent=state.gold;document.getElementById('lvl').textContent=state.level;document.getElementById('xp').textContent=state.xp;document.getElementById('xpnext').textContent=state.xpNext;document.getElementById('pots').textContent=state.potions;}
function drawTile(r,c){const x=c*TILE,y=r*TILE,t=map[r][c];if(t==='grassLight'){ctx.fillStyle=COLORS.grassLight;ctx.fillRect(x,y,TILE,TILE);}else if(t==='grass'){ctx.fillStyle=COLORS.grass;ctx.fillRect(x,y,TILE,TILE);}else if(t==='path'){ctx.fillStyle=COLORS.path;ctx.fillRect(x,y,TILE,TILE);}else if(t==='water'){ctx.fillStyle=COLORS.water;ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle=COLORS.waterLight;ctx.fillRect(x+4,y+4,TILE-8,6);ctx.fillRect(x+8,y+20,TILE-16,5);}else if(t==='tree'){ctx.fillStyle='#1a3d17';ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='#2a5a24';ctx.beginPath();ctx.arc(x+TILE/2,y+TILE/2,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a7a33';ctx.beginPath();ctx.arc(x+TILE/2,y+TILE/2-4,10,0,Math.PI*2);ctx.fill();}else if(t==='mountain'){ctx.fillStyle=COLORS.mountain;ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='#8a7060';ctx.beginPath();ctx.moveTo(x+TILE/2,y+6);ctx.lineTo(x+TILE-4,y+TILE-4);ctx.lineTo(x+4,y+TILE-4);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+TILE/2,y+6);ctx.lineTo(x+TILE/2+8,y+18);ctx.lineTo(x+TILE/2-8,y+18);ctx.closePath();ctx.fill();}}
function drawEntity(e){const x=e.c*TILE,y=e.r*TILE;if(e.type==='monster'){const col=COLORS.monster[e.mtype]||'#e74c3c';ctx.fillStyle=col;if(e.mtype==='slime'){ctx.beginPath();ctx.ellipse(x+TILE/2,y+TILE/2+4,13,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+TILE/2-4,y+TILE/2,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+TILE/2+4,y+TILE/2,3,0,Math.PI*2);ctx.fill();}else if(e.mtype==='wolf'){ctx.fillRect(x+10,y+14,20,16);ctx.beginPath();ctx.arc(x+TILE/2,y+18,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+TILE/2-3,y+16,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+TILE/2-3,y+16,1,0,Math.PI*2);ctx.fill();}else{ctx.fillRect(x+8,y+10,24,20);ctx.fillStyle='#f39c12';ctx.beginPath();ctx.arc(x+TILE/2,y+12,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+TILE/2-3,y+11,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+TILE/2-3,y+11,1.5,0,Math.PI*2);ctx.fill();}const barW=TILE-8;ctx.fillStyle='#333';ctx.fillRect(x+4,y+3,barW,4);ctx.fillStyle=e.hp/e.maxhp>0.5?'#2ecc71':'#e74c3c';ctx.fillRect(x+4,y+3,barW*(e.hp/e.maxhp),4);}else if(e.type==='chest'){ctx.fillStyle=COLORS.chestShadow;ctx.fillRect(x+8,y+20,24,14);ctx.fillStyle=COLORS.chest;ctx.fillRect(x+8,y+14,24,12);ctx.fillStyle='#a0802a';ctx.fillRect(x+8,y+23,24,2);ctx.fillStyle='#fff8dc';ctx.fillRect(x+18,y+17,4,5);}else if(e.type==='portal'){ctx.fillStyle=COLORS.portal;ctx.beginPath();ctx.ellipse(x+TILE/2,y+TILE/2,14,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c39bd3';ctx.beginPath();ctx.ellipse(x+TILE/2,y+TILE/2,9,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8daef';ctx.beginPath();ctx.ellipse(x+TILE/2,y+TILE/2,5,8,0,0,Math.PI*2);ctx.fill();}}
function drawPlayer(){const x=state.pc*TILE,y=state.pr*TILE;ctx.fillStyle='#996633';ctx.fillRect(x+13,y+24,14,12);ctx.fillStyle=COLORS.playerShadow;ctx.fillRect(x+12,y+10,16,18);ctx.fillStyle=COLORS.player;ctx.beginPath();ctx.arc(x+TILE/2,y+12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#cc3333';ctx.fillRect(x+10,y+6,20,6);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+TILE/2-3,y+12,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+TILE/2+3,y+12,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x+TILE/2-3,y+12,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+TILE/2+3,y+12,1.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c8a020';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+TILE-4,y+14);ctx.lineTo(x+TILE-4,y+34);ctx.stroke();}
function render(){ctx.clearRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)drawTile(r,c);entities.forEach(e=>drawEntity(e));drawPlayer();}
function gainXP(amount){state.xp+=amount;while(state.xp>=state.xpNext){state.xp-=state.xpNext;state.level++;state.xpNext=Math.floor(state.xpNext*1.5);state.maxhp+=20;state.hp=Math.min(state.hp+30,state.maxhp);showMsg('Niveau '+state.level+' ! ');}}
function move(dc,dr){if(state.hp<=0)return;const nr=state.pr+dr,nc=state.pc+dc;if(!isWalkable(nr,nc)){setLog('Chemin bloqué !');return;}const ei=entities.findIndex(e=>e.r===nr&&e.c===nc);if(ei!==-1){const e=entities[ei];if(e.type==='monster'){const atk=10+state.level*3+Math.floor(Math.random()*8);const def=Math.floor(Math.random()*6);e.hp-=atk;if(e.hp<=0){const xpGain=e.mtype==='slime'?10:e.mtype==='wolf'?20:50;const gold=e.mtype==='slime'?3:e.mtype==='wolf'?8:20;const killed=e.mtype;entities.splice(ei,1);gainXP(xpGain);state.gold+=gold;setLog('Tu bats le '+killed+' ! +'+xpGain+' XP +'+gold+' or');}else{const dmg=Math.max(1,(e.mtype==='slime'?8:e.mtype==='wolf'?15:30)-def);state.hp-=dmg;setLog('Tu attaques le '+e.mtype+' ('+e.hp+' HP) — il te fait '+dmg+' dégâts.');if(state.hp<=0){state.hp=0;showMsg('Tu es mort... Recommence !',2500);}}}else if(e.type==='chest'){const gold=15+Math.floor(Math.random()*25);state.gold+=gold;if(Math.random()<0.4){state.potions++;setLog('Coffre : +'+gold+' or et une potion !');}else setLog('Coffre : +'+gold+' or !');entities.splice(ei,1);}else if(e.type==='portal'){state.level++;state.maxhp+=10;state.hp=state.maxhp;state.potions+=2;initMap();spawnEntities();state.pr=Math.floor(ROWS/2);state.pc=Math.floor(COLS/2);showMsg('Nouveau niveau ! Zone '+state.level,2000);setLog('Tu traverses le portail vers une nouvelle zone !');render();updateUI();return;}}else{state.pr=nr;state.pc=nc;state.steps++;if(state.steps%12===0&&Math.random()<0.5){const dmg=Math.floor(Math.random()*5);if(dmg>0&&state.hp>0){state.hp-=dmg;setLog('Une embuscade ! Tu perds '+dmg+' HP.');}}}render();updateUI();}
function usePotion(){if(state.potions<=0){setLog('Plus de potions !');return;}if(state.hp>=state.maxhp){setLog('Tu es déjà au maximum !');return;}const heal=40;state.hp=Math.min(state.maxhp,state.hp+heal);state.potions--;setLog('Tu bois une potion : +'+heal+' HP.');updateUI();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-1,0);}else if(e.key==='ArrowRight'){e.preventDefault();move(1,0);}else if(e.key==='ArrowUp'){e.preventDefault();move(0,-1);}else if(e.key==='ArrowDown'){e.preventDefault();move(0,1);}else if(e.key==='p'||e.key==='P')usePotion();});
resetGame();
</script>
</body>
</html>
